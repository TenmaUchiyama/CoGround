[project]
name = "coground-server"
version = "0.1.0"
description = "CoGround grounding server (Unity <-> FastAPI WebSocket)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coground_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
