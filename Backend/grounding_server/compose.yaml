services:
  grounding_server:
    build: .
    image: coground/grounding_server:dev
    container_name: coground_grounding_server
    ports:
      - "8000:8000"
    volumes:
      # コードを変えたら自動で再起動する（--reload）
      - ./coground_server:/app/coground_server
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      # LLM の呼び出しの記録（llm.jsonl）
      - ./logs:/app/logs
    command: ["python", "-m", "coground_server", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # LLM の認証（CLAUDE_CODE_OAUTH_TOKEN か ANTHROPIC_API_KEY）は .env に書く。.env.example を写して作る
    env_file:
      - path: .env
        required: false
    environment:
      - COGROUND_LOG_LEVEL=info
      - COGROUND_LLM_LOG=/app/logs/llm.jsonl
